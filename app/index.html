<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Magic-kort – Faraos Cigarer</title>
<meta name="description" content="Find Magic: The Gathering-enkeltkort på lager hos Faraos Cigarer i København.">
<meta name="theme-color" content="#121214">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Magic-kort">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root { --bg: #121214; --card: #1e1e22; --line: #ffffff1f; --text: #fff; --grey: #8a8a92;
          --gold: #e8b04b; --green: #4cc38a; --amber: #e8b04b; --red: #e5534b; color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  body.locked { overflow: hidden; }
  button { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  header { padding: 18px 16px 4px; max-width: 1400px; margin: 0 auto; }
  h1 { font-size: 30px; margin: 0; letter-spacing: -.3px; }
  .store { color: var(--grey); font-size: 14px; }

  .bar { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 8px 16px 6px; max-width: 1400px; margin: 0 auto;
         padding-top: max(8px, env(safe-area-inset-top)); margin-top: calc(-1 * env(safe-area-inset-top)); }
  .searchrow { display: flex; gap: 8px; align-items: center; }
  form { flex: 1; min-width: 0; margin: 0; }
  .field { width: 100%; background: var(--card); color: #fff; border: 2px solid #ffffff40; border-radius: 28px;
           padding: 11px 18px; font: inherit; font-size: 17px; outline: none; -webkit-appearance: none; appearance: none; }
  .field:focus { border-color: var(--gold); }
  .field::placeholder { color: var(--grey); }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding-top: 8px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }

  .btn { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 9px 16px; font-weight: 700;
         font-size: 15px; white-space: nowrap; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; justify-content: center; }
  .btn.accent { background: var(--gold); border-color: var(--gold); color: #000; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.small { font-size: 14px; padding: 8px 14px; }
  .btn.round { width: 40px; height: 40px; padding: 0; border-radius: 50%; font-size: 20px; }
  .btn.icon { width: 46px; height: 46px; padding: 0; border-radius: 50%; position: relative; }
  .btn .count { font-size: 14px; }
  .btn.icon .count:not(:empty) { position: absolute; top: -4px; right: -4px; background: var(--gold); color: #000; border-radius: 10px;
         min-width: 20px; height: 20px; font-size: 12px; line-height: 20px; padding: 0 5px; border: 2px solid var(--bg); }
  #setChip img { height: 20px; }

  main { max-width: 1400px; margin: 0 auto; padding: 8px 16px 24px; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .tile { background: var(--card); border: 0; border-radius: 12px; padding: 8px 8px 10px; text-align: left; cursor: pointer; min-width: 0; }
  .tile:active { transform: scale(.98); }
  .tile .name { font-weight: 700; font-size: 15px; margin: 8px 4px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .set { color: var(--grey); font-size: 12px; margin: 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .row { display: flex; align-items: center; gap: 6px; margin: 6px 4px 0; }
  .tile .price { font-weight: 700; font-size: 15px; flex: 1; }
  .badge { font-weight: 700; font-size: 12px; }
  .green { color: var(--green); } .amber { color: var(--amber); } .grey { color: var(--grey); } .red { color: var(--red); }

  /* The shop's pictures are 2:3 with white bars top and bottom: crop to the card's 63:88 shape. */
  .pic { aspect-ratio: 63 / 88; border-radius: 4.6% / 3.3%; overflow: hidden; background: #2a2a30; }
  .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pic.big { width: min(100%, 360px); margin: 0 auto; }
  .pic.thumb { width: 54px; flex: none; border-radius: 4px; }

  #empty { color: var(--grey); text-align: center; white-space: pre-line; padding: 60px 20px; font-size: 17px; }
  #more { height: 1px; }
  footer { position: sticky; bottom: 0; background: var(--bg); color: var(--grey); font-size: 13px; padding: 8px 16px;
           padding-bottom: max(8px, env(safe-area-inset-bottom)); max-width: 1400px; margin: 0 auto; }

  #overlay { position: fixed; inset: 0; z-index: 20; background: #000000b0; overflow-y: auto; overscroll-behavior: contain;
             padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom)); animation: fade .15s; }
  @keyframes fade { from { opacity: 0; } }
  .panel { background: var(--card); border-radius: 20px; padding: 20px 18px; max-width: 760px; margin: 0 auto; }
  .panel h2 { font-size: 26px; margin: 4px 0 0; }
  /* Grab handle: the panel can be pulled down to close it (touch screens). */
  @media (pointer: coarse) {
    .panel { position: relative; padding-top: 26px; }
    .panel::before { content: ""; position: absolute; top: 9px; left: 50%; width: 40px; height: 5px; margin-left: -20px;
                     border-radius: 3px; background: #ffffff40; }
  }
  .kicker { color: var(--gold); font-weight: 700; font-size: 13px; letter-spacing: 1px; }
  .kicker.head { margin: 22px 0 6px; letter-spacing: 1.5px; }
  .detail .info { padding-top: 16px; }
  .detail h2 { margin-top: 6px; }
  .badge.big { font-size: 16px; margin-top: 10px; }
  .copy { background: #ffffff14; border-radius: 10px; padding: 12px 14px; margin-top: 6px; }
  .copy.dim { background: #ffffff08; color: var(--grey); }
  .line { display: flex; align-items: center; gap: 10px; }
  .copy .line + .line { margin-top: 8px; }
  .grow { flex: 1; min-width: 0; }
  .right { text-align: right; }
  .cond { font-weight: 700; }
  .extra { color: var(--gold); font-size: 13px; }
  .copy .price { font-weight: 700; font-size: 17px; }
  .copy .badge { font-size: 13px; }
  .note { color: var(--grey); font-size: 12px; margin: 14px 0 20px; }
  @media (min-width: 760px) {
    .detail { display: flex; gap: 28px; max-width: 1000px; }
    .detail .pic.big { flex: 0 0 360px; margin: 0; }
    .detail .info { flex: 1; padding-top: 0; }
  }

  .how { color: #ffffffcc; margin: 4px 0 14px; }
  .cartrow { display: flex; gap: 12px; background: #ffffff14; border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; align-items: flex-start; }
  .cartrow .name { font-weight: 700; font-size: 17px; }
  .cartrow .set { color: var(--grey); font-size: 13px; }
  .cartrow .copyline { color: var(--gold); font-size: 13px; font-weight: 700; }
  .cartrow .line { margin-top: 8px; }
  .qty { font-size: 18px; font-weight: 700; min-width: 28px; text-align: center; }
  .cartrow .price { font-weight: 700; font-size: 17px; }
  .emptycart { color: var(--grey); white-space: pre-line; padding: 24px 0; font-size: 17px; }
  .qrbox { text-align: center; margin-top: 12px; }
  .qrbox canvas { width: min(260px, 80vw); height: auto; image-rendering: pixelated; border-radius: 4px; }
  .total { font-size: 21px; font-weight: 800; margin-top: 16px; }
  .buttons { display: flex; gap: 10px; justify-content: flex-end; margin-top: 14px; flex-wrap: wrap; }
  .buttons .btn, .detail .btn.accent { padding: 12px 22px; font-size: 16px; }

  .sets .field { margin: 12px 0 8px; }
  .setlist { max-height: 60vh; overflow-y: auto; margin-bottom: 14px; }
  .setrow { display: flex; align-items: center; gap: 14px; width: 100%; background: none; border: 0; border-bottom: 1px solid var(--line);
            padding: 10px 6px; text-align: left; font-size: 17px; cursor: pointer; }
  .seticon { width: 44px; height: 30px; display: grid; place-items: center; flex: none; }
  .seticon img { max-width: 44px; max-height: 30px; }

  #install { position: fixed; left: 12px; right: 12px; bottom: max(12px, env(safe-area-inset-bottom)); z-index: 10; background: #2a2a30;
             border: 1px solid var(--gold); border-radius: 14px; padding: 12px 14px; display: flex; gap: 10px; align-items: center;
             max-width: 560px; margin: 0 auto; box-shadow: 0 8px 30px #0008; }
  #install .text { flex: 1; font-size: 14px; }
  #install .x { background: none; border: 0; color: var(--grey); font-size: 20px; padding: 4px 6px; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>Magic-kort</h1>
  <div class="store">Faraos Cigarer · København</div>
</header>
<div class="bar">
  <div class="searchrow">
    <form id="searchForm" role="search">
      <input id="search" class="field" type="search" placeholder="Søg efter et kort" autocomplete="off" autocorrect="off"
             autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="Søg efter et kort">
    </form>
    <button id="clearBtn" class="btn icon" type="button" aria-label="Ryd søgning">✕</button>
    <button id="cartBtn" class="btn icon" type="button" aria-label="Kurv">🛒<span class="count"></span></button>
  </div>
  <div class="chips">
    <button id="hereChip" class="btn chip" type="button">✓ Kun på lager i butikken</button>
    <button id="setChip" class="btn chip" type="button">Alle sæt ▾</button>
  </div>
  <div id="colors" class="chips" hidden></div>
</div>
<main>
  <div id="grid"></div>
  <div id="empty" hidden></div>
  <div id="more"></div>
</main>
<footer id="status">Henter kort…</footer>
<div id="overlay" hidden></div>
<div id="install" hidden>
  <span class="text"></span>
  <button class="btn small accent go" type="button">Installer</button>
  <button class="x" type="button" aria-label="Luk">✕</button>
</div>
<script src="qr.js"></script>
<script src="app.js"></script>
</body>
</html>
