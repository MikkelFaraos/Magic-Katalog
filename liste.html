<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Kundens kurv – Magic-kort</title>
<style>
  :root { --bg: #121214; --card: #1e1e22; --line: #ffffff1f; --text: #fff; --grey: #8a8a92; --gold: #e8b04b; --green: #4cc38a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 26px; margin: 0; }
  .meta { color: var(--grey); margin: 2px 0 16px; }
  .hint { color: var(--grey); font-size: 14px; margin: 0 0 14px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: grid; grid-template-columns: 34px 1fr auto; gap: 4px 12px; align-items: center;
       background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; cursor: pointer; }
  li.done { opacity: .45; }
  li.done .name { text-decoration: line-through; }
  .box { width: 26px; height: 26px; border: 2px solid var(--gold); border-radius: 7px; display: grid; place-items: center; font-weight: 700; color: transparent; }
  li.done .box { color: #000; }
  li.done .box { background: var(--gold); }
  .name { font-weight: 700; font-size: 17px; }
  .set { color: var(--grey); font-size: 14px; }
  .copy { color: var(--gold); font-size: 14px; font-weight: 600; }
  .nr { font-family: ui-monospace, Consolas, monospace; font-size: 15px; letter-spacing: .5px; }
  .right { text-align: right; white-space: nowrap; }
  .qty { font-size: 20px; font-weight: 800; }
  .price { color: var(--grey); font-size: 14px; }
  .total { display: flex; justify-content: space-between; font-size: 22px; font-weight: 800; padding: 14px 4px 0; border-top: 1px solid var(--line); margin-top: 8px; }
  .err { background: #3a1d1d; border: 1px solid #e5534b; border-radius: 12px; padding: 16px; }
</style>
</head>
<body>
<main>
  <h1>Kundens kurv</h1>
  <p class="meta" id="meta">Magic-kort · Faraos Cigarer</p>
  <p class="hint">Tryk på en linje for at krydse den af, når kortet er fundet.</p>
  <ul id="list"></ul>
  <div class="total" id="total" hidden><span id="count"></span><span id="sum"></span></div>
</main>
<script>
// The cart is packed into the address after "#z=" (deflate + base64url) by the Magic-kort app.
// Nothing is sent to a server: the page only reads its own address.
const money = v => (Number.isInteger(v) ? v.toLocaleString("da-DK") + ",-" : v.toLocaleString("da-DK", { minimumFractionDigits: 2 })) + " kr.";
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function decode(hash) {
  const m = /^#z=([A-Za-z0-9_-]+)$/.exec(hash);
  if (!m) throw new Error("Ingen kurv i linket.");
  const b64 = m[1].replace(/-/g, "+").replace(/_/g, "/");
  const bytes = Uint8Array.from(atob(b64 + "===".slice((b64.length + 3) % 4)), c => c.charCodeAt(0));
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return JSON.parse(await new Response(stream).text());
}

decode(location.hash).then(cart => {
  document.getElementById("meta").textContent =
    "Magic-kort · Faraos Cigarer" + (cart.s ? " · " + cart.s : "") + (cart.t ? " · " + cart.t : "");
  const list = document.getElementById("list");
  let n = 0, sum = 0;
  for (const [id, name, set, cond, extra, qty, price] of cart.i) {
    n += qty; sum += qty * price;
    const li = document.createElement("li");
    li.innerHTML = `<div class="box">✓</div>
      <div><div class="name">${esc(name)}</div><div class="set">${esc(set)}</div>
        <div class="copy">${esc(cond)}${extra ? " · " + esc(extra) : ""} · <span class="nr">${esc(id)}</span></div></div>
      <div class="right"><div class="qty">${qty} stk.</div><div class="price">${money(qty * price)}</div></div>`;
    li.onclick = () => li.classList.toggle("done");
    list.appendChild(li);
  }
  document.getElementById("count").textContent = n + " kort";
  document.getElementById("sum").textContent = "I alt " + money(sum);
  document.getElementById("total").hidden = false;
}).catch(e => {
  document.getElementById("list").innerHTML = `<li class="err" style="display:block">Kunne ikke læse kurven: ${esc(e.message)}<br>Scan QR-koden på tabletten igen.</li>`;
});
</script>
</body>
</html>
